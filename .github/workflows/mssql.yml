name: MSSQL compatibility

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main

jobs:
  mssql-test:
    name: SQL Server 2022 integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Wait for SQL Server and create database
        shell: bash
        run: |
          ready=false
          for attempt in {1..30}; do
            if docker exec "${{ job.services.mssql.id }}" \
              /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" \
              > /dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            docker logs "${{ job.services.mssql.id }}"
            exit 1
          fi

          docker exec "${{ job.services.mssql.id }}" \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C \
            -Q "IF DB_ID(N'logiops') IS NULL CREATE DATABASE logiops"

      - name: Run H2 and MSSQL test suites
        env:
          MSSQL_URL: jdbc:sqlserver://localhost:1433;databaseName=logiops;encrypt=true;trustServerCertificate=true
          MSSQL_USERNAME: sa
          MSSQL_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        run: ./gradlew clean test mssqlTest --no-daemon
